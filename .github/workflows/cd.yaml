name: Continuous Deployment
on:
  workflow_run:
    workflows: ["CI tests about Powerbuilder"]
    types:
      - completed
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  discussions: write

jobs:
  windows:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: windows-2025
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-tags: true
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Publish Windows distributions
        shell: pwsh
        run: ./scripts/publish-windows.ps1 -OutputRoot artifacts/release

      - name: Upload Windows distribution
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: artifacts/release
          if-no-files-found: error

  apple:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-tags: true
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Install Apple workloads
        run: dotnet workload install ios macos maccatalyst

      - name: Publish managed Apple libraries
        run: |
          set -euo pipefail
          proj=src/PdfToImageConverter/PdfToImageConverter.csproj
          dotnet publish "$proj" -f net10.0 -r osx-x64 -c Release -p:UseMonoRuntime=false -o artifacts/release/net10/managed/osx-x64
          dotnet publish "$proj" -f net10.0 -r osx-arm64 -c Release -p:UseMonoRuntime=false -o artifacts/release/net10/managed/osx-arm64
          dotnet publish "$proj" -f net10.0-ios -r ios-arm64 -c Release -o artifacts/release/net10/managed/net10.0-ios
          dotnet publish "$proj" -f net10.0-macos -r osx-arm64 -c Release -o artifacts/release/net10/managed/net10.0-macos
          dotnet publish "$proj" -f net10.0-maccatalyst -r maccatalyst-arm64 -c Release -o artifacts/release/net10/managed/net10.0-maccatalyst

      - name: Package Native AOT xcframeworks
        run: bash scripts/package-apple-xcframework.sh artifacts/release

      - name: Upload Apple distribution
        uses: actions/upload-artifact@v4
        with:
          name: apple-dist
          path: artifacts/release
          if-no-files-found: error

  release:
    needs: [windows, apple]
    runs-on: windows-2025
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-tags: true
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          path: release-parts

      - name: Assemble release ZIP
        shell: pwsh
        run: |
          $releaseDir = "${{ github.workspace }}\release-files"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          Copy-Item -Path "${{ github.workspace }}\release-parts\windows-dist\*" -Destination $releaseDir -Recurse -Force
          Copy-Item -Path "${{ github.workspace }}\release-parts\apple-dist\*" -Destination $releaseDir -Recurse -Force
          Compress-Archive -Path "$releaseDir\*" -DestinationPath "$releaseDir\PdfToImageConverter-Full.zip" -Force

      - name: Get latest release version and Generate release notes
        id: get_latest_release
        shell: pwsh
        run: |
          $latest_release = git tag --list --sort=-version:refname | Where-Object { $_ -match '^\d+\.\d+\.\d+$' } | Select-Object -First 1
          $headSubject = (git log -1 --format=%s).Trim()

          if ($latest_release) {
            Write-Output "Latest release version: $latest_release"
            echo "latest_release=$latest_release" >> $env:GITHUB_ENV

            if ($headSubject -match '^\d+\.\d+\.\d+$') {
              $newVersionString = $headSubject
              Write-Output "Using version from HEAD commit subject: $newVersionString"
            } else {
              $version = [Version]$latest_release
              $newVersionString = '{0}.{1}.{2}' -f $version.Major, $version.Minor, ($version.Build + 1)
            }

            $releaseNotes = "## Changes since " + $latest_release + "`n"
            $releaseNotes += (git log "$latest_release..HEAD" --oneline) -join "`n"
            $releaseNotes += "`n"
            $releaseNotes += "### File edited `n"
            $releaseNotes += "`n"
            $releaseNotes += (git diff "$latest_release..HEAD" --compact-summary) -join "`n"
          } else {
            Write-Output "No previous release found. Creating initial release 0.0.1"
            $newVersionString = "0.0.1"

            $releaseNotes = "## Initial Release v0.0.1`n"
            $releaseNotes += (git log --oneline) -join "`n"
            $releaseNotes += "`n"
            $releaseNotes += "### Files included `n"
            $releaseNotes += "`n"
            $releaseNotes += (git ls-files | ForEach-Object { "Added $_" }) -join "`n"
          }

          echo "new_release=$newVersionString" >> $env:GITHUB_ENV
          $releaseNotes | Out-File -FilePath releaseNotes.txt -Encoding utf8
          $releaseNotesContent = Get-Content -Path releaseNotes.txt -Raw
          echo "release_notes<<EOF" >> $env:GITHUB_ENV
          echo "$releaseNotesContent" >> $env:GITHUB_ENV
          echo "EOF" >> $env:GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ github.workspace }}\release-files\PdfToImageConverter-Full.zip
            ${{ github.workspace }}\release-files\net481\win-x86\PdfToImageConverter.dll
          tag_name: ${{ env.new_release }}
          name: Release ${{ env.new_release }}
          body: ${{ env.release_notes }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
